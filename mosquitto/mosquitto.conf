# Copied from iot-home docker/mosquitto/mosquitto.conf; keep the two in step.
# The bridge reaches the broker from the LAN, so every client must authenticate.
listener 1883
allow_anonymous false
# Written at start-up by start.sh from MQTT_USERNAME / MQTT_PASSWORD.
password_file /tmp/passwd

# Keep retained messages (device inventory, reachability) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
