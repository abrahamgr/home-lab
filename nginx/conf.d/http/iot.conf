# From iot-home docker/nginx/iot.conf (plan §11); keep the two in step.
# Most specific location first.
#
# The upstreams are variables, so nginx looks them up per request through Docker's DNS
# instead of once at start-up. Without that, nginx refuses to start while iot-api or
# iot-web does not exist (first deploy, failed load, rollback), taking every other
# app behind the proxy down with it. Now /iot answers 502 and the rest is unaffected.

location /iot/ws {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iot_api http://iot-api:3001;
    proxy_pass $iot_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;   # the API refuses an upgrade whose Origin host differs (§7)
    proxy_read_timeout 3600s;
}
location /iot/api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iot_api http://iot-api:3001;
    # With a variable upstream nginx no longer swaps the prefix itself.
    rewrite ^/iot(/api/.*)$ $1 break;
    proxy_pass $iot_api;
    include /etc/nginx/headers.conf;
}
location /iot {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iot_web http://iot-web:3000;
    proxy_pass $iot_web;
    include /etc/nginx/headers.conf;
}
